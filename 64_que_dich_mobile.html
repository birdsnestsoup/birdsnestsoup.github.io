<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>64 QUẺ DỊCH - BẢN GỐC CHI TIẾT</title>
    <style>
        :root {
            --crimson: #8e2424;
            --crimson-dark: #6b1a1a;
            --crimson-light: #c0392b;
            --gold: #c9a84c;
            --gold-light: #f0d080;
            --parchment: #fdf8ee;
            --parchment-dark: #f0e8d0;
            --ink: #1a1208;
            --ink-light: #3d2b1a;
            --border: #c8b494;
            --shadow: rgba(100, 60, 20, 0.15);

            /* Fluid font sizes using clamp() */
            --fs-xs: clamp(0.75rem, 2.5vw, 0.875rem);
            --fs-sm: clamp(0.875rem, 3vw, 1rem);
            --fs-base: clamp(1rem, 3.5vw, 1.125rem);
            --fs-md: clamp(1.1rem, 4vw, 1.25rem);
            --fs-lg: clamp(1.25rem, 5vw, 1.5rem);
            --fs-xl: clamp(1.5rem, 6vw, 2rem);
            --fs-2xl: clamp(1.75rem, 7vw, 2.5rem);

            --spacing-xs: clamp(4px, 1.5vw, 8px);
            --spacing-sm: clamp(8px, 2.5vw, 14px);
            --spacing-md: clamp(12px, 3.5vw, 20px);
            --spacing-lg: clamp(16px, 4.5vw, 28px);
            --spacing-xl: clamp(20px, 6vw, 40px);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }

        html {
            font-size: 16px;
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            background-color: var(--parchment);
            background-image:
                radial-gradient(ellipse at top left, rgba(201,168,76,0.08) 0%, transparent 60%),
                radial-gradient(ellipse at bottom right, rgba(142,36,36,0.06) 0%, transparent 60%);
            min-height: 100vh;
            color: var(--ink);
            line-height: 1.75;
            padding: 0;
            margin: 0;
        }

        /* ── HEADER ── */
        .site-header {
            background: linear-gradient(135deg, var(--crimson-dark) 0%, var(--crimson) 60%, #a83030 100%);
            color: #fff;
            text-align: center;
            padding: var(--spacing-lg) var(--spacing-md);
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .site-header::before {
            content: '';
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(
                45deg,
                transparent,
                transparent 20px,
                rgba(255,255,255,0.03) 20px,
                rgba(255,255,255,0.03) 40px
            );
        }

        .site-header h1 {
            font-size: var(--fs-xl);
            font-weight: 700;
            letter-spacing: 0.05em;
            text-shadow: 0 2px 8px rgba(0,0,0,0.4);
            position: relative;
        }

        .site-header p {
            font-size: var(--fs-sm);
            color: var(--gold-light);
            margin-top: var(--spacing-xs);
            font-style: italic;
            position: relative;
        }

        /* ── SEARCH BAR ── */
        .search-bar {
            position: sticky;
            top: 0;
            z-index: 200;
            background: rgba(255,252,240,0.97);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-bottom: 2px solid var(--crimson);
            padding: var(--spacing-sm) var(--spacing-md);
            display: flex;
            gap: var(--spacing-sm);
            flex-wrap: wrap;
            align-items: center;
            box-shadow: 0 2px 12px var(--shadow);
        }

        .search-input-wrap {
            flex: 1;
            min-width: 0;
            position: relative;
        }

        .search-input-wrap input {
            width: 100%;
            padding: var(--spacing-sm) var(--spacing-md);
            padding-right: 2.5rem;
            font-size: var(--fs-base);
            font-family: inherit;
            border: 1.5px solid var(--border);
            border-radius: 6px;
            background: #fff;
            color: var(--ink);
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            -webkit-appearance: none;
        }

        .search-input-wrap input:focus {
            border-color: var(--crimson);
            box-shadow: 0 0 0 3px rgba(142,36,36,0.15);
        }

        .search-input-wrap input::placeholder {
            color: #aaa;
            font-style: italic;
        }

        .btn-group {
            display: flex;
            gap: var(--spacing-xs);
            flex-shrink: 0;
        }

        .btn {
            padding: var(--spacing-sm) var(--spacing-md);
            font-size: var(--fs-sm);
            font-family: inherit;
            font-weight: 700;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.18s ease;
            white-space: nowrap;
            letter-spacing: 0.03em;
            -webkit-tap-highlight-color: transparent;
        }

        .btn-primary {
            background: var(--crimson);
            color: #fff;
            box-shadow: 0 2px 6px rgba(142,36,36,0.35);
        }

        .btn-primary:hover, .btn-primary:active {
            background: var(--crimson-dark);
            transform: translateY(-1px);
            box-shadow: 0 4px 10px rgba(142,36,36,0.4);
        }

        .btn-secondary {
            background: var(--ink-light);
            color: #fff;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }

        .btn-secondary:hover, .btn-secondary:active {
            background: var(--ink);
            transform: translateY(-1px);
        }

        /* Count badge */
        .result-count {
            font-size: var(--fs-xs);
            color: var(--crimson);
            padding: var(--spacing-xs) var(--spacing-sm);
            background: rgba(142,36,36,0.08);
            border-radius: 20px;
            font-weight: 600;
            display: none;
        }

        /* ── MAIN CONTENT ── */
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: var(--spacing-lg) var(--spacing-md);
        }

        /* ── QUE BLOCK ── */
        .que-block {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 10px;
            margin-bottom: var(--spacing-xl);
            overflow: hidden;
            box-shadow: 0 2px 12px var(--shadow);
            transition: box-shadow 0.2s;
        }

        .que-block:hover {
            box-shadow: 0 6px 24px rgba(100,60,20,0.18);
        }

        .que-header {
            background: linear-gradient(135deg, rgba(142,36,36,0.06) 0%, rgba(201,168,76,0.06) 100%);
            border-bottom: 1px solid var(--parchment-dark);
            padding: var(--spacing-md) var(--spacing-lg);
        }

        .que-header h2 {
            font-size: var(--fs-lg);
            color: var(--crimson);
            font-weight: 700;
            line-height: 1.3;
        }

        .que-body {
            padding: var(--spacing-md) var(--spacing-lg);
            font-size: var(--fs-base);
            line-height: 1.8;
            white-space: pre-wrap;
            color: var(--ink-light);
        }

        .que-body b {
            color: var(--ink);
            font-size: calc(var(--fs-base) * 1.05);
            display: block;
            margin-bottom: var(--spacing-sm);
            padding: var(--spacing-sm) var(--spacing-md);
            background: linear-gradient(90deg, rgba(201,168,76,0.12), transparent);
            border-left: 3px solid var(--gold);
            border-radius: 0 4px 4px 0;
        }

        .que-body .red {
            color: #c0392b;
            font-weight: 700;
        }

        .que-body .blue {
            color: #1a5276;
            font-weight: 700;
        }

        .que-body .green {
            color: #1e6b3e;
            font-weight: 700;
        }

        .que-body .brown {
            color: #7d4f1a;
            font-weight: 700;
        }

        /* ── NO RESULT ── */
        .no-result {
            text-align: center;
            padding: var(--spacing-xl);
            color: var(--ink-light);
            font-size: var(--fs-md);
            font-style: italic;
        }

        /* ── FOOTER ── */
        .site-footer {
            text-align: center;
            padding: var(--spacing-lg);
            font-size: var(--fs-xs);
            color: #999;
            border-top: 1px solid var(--parchment-dark);
            background: rgba(0,0,0,0.02);
        }

        /* ── BACK TO TOP ── */
        .back-top {
            position: fixed;
            bottom: clamp(16px, 5vw, 28px);
            right: clamp(16px, 5vw, 28px);
            width: clamp(40px, 10vw, 50px);
            height: clamp(40px, 10vw, 50px);
            background: var(--crimson);
            color: #fff;
            border: none;
            border-radius: 50%;
            font-size: var(--fs-lg);
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(142,36,36,0.45);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 300;
            transition: all 0.2s;
            -webkit-tap-highlight-color: transparent;
        }

        .back-top.show {
            display: flex;
        }

        .back-top:hover {
            background: var(--crimson-dark);
            transform: translateY(-3px);
        }

        /* ── MOBILE OVERRIDES ── */
        @media (max-width: 600px) {
            .search-bar {
                flex-direction: column;
                align-items: stretch;
            }

            .btn-group {
                width: 100%;
            }

            .btn {
                flex: 1;
                text-align: center;
            }

            .que-header {
                padding: var(--spacing-md);
            }

            .que-body {
                padding: var(--spacing-md);
            }

            .container {
                padding: var(--spacing-md) var(--spacing-sm);
            }
        }

        /* ── HIGHLIGHT MATCH ── */
        mark {
            background: rgba(201,168,76,0.35);
            color: inherit;
            border-radius: 2px;
            padding: 0 2px;
        }

        /* ── ANIMATION ── */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .que-block {
            animation: fadeIn 0.3s ease both;
        }
    </style>
</head>
<body>

<header class="site-header">
    <h1>☰ 64 Quẻ Dịch ☷</h1>
    <p>Kinh Dịch — Bản gốc chi tiết đầy đủ</p>
</header>

<div class="search-bar">
    <div class="search-input-wrap">
        <input type="text" id="findInput"
               placeholder="Nhập số quẻ hoặc tên quẻ để tìm..."
               oninput="debounceSearch()"
               onkeydown="if(event.key==='Enter') doSearch()">
    </div>
    <div class="btn-group">
        <button class="btn btn-primary" onclick="doSearch()">🔍 Tìm</button>
        <button class="btn btn-secondary" onclick="showAll()">↺ Tất cả</button>
    </div>
    <span class="result-count" id="resultCount"></span>
</div>

<main class="container" id="mainBody"></main>

<footer class="site-footer">
    64 Quẻ Dịch &mdash; Bố cục tối ưu cho di động &amp; máy tính
</footer>

<button class="back-top" id="backTop" onclick="scrollToTop()" title="Lên đầu trang">↑</button>

<script>
const fullData = [
    {
        title: "1. <span class='red'>Thuần KIỀN</span> — Quẻ Số 1",
        content: `<b>Đấng Sáng Tạo : Sáng tạo, thành công, sức mạnh, quyền lực</b>

Kiện dã. Cứng mạnh, khô, lớn, khỏe mạnh, đức không nghỉ. Tượng vạn vật có khởi đầu, lớn lên, toại chí, hóa thành. Càn tượng trưng cho trời và năng lực sáng tạo. Tất cả các vạch đều là vạch liền, tức vạch dương — tột đỉnh của dương lực. Càn là ánh sáng, sự mạnh mẽ, tích cực, hành động và bền gan trì chí. Nói rộng ra, Càn đại diện cho vũ trụ đang biến dịch không ngừng.

Càn thay cho con đường của trời, còn quẻ kế tiếp Khôn giải thích con đường của đất. Càn tượng trưng cho sự sung thịnh, khỏe mạnh, tráng kiện và sum suê. Nhưng đang giữa sự cực dương thì âm tất sẽ nảy sinh. Lời khuyên: nên thật cẩn thận, biết lưu ý sẽ tránh được điều bất ngờ.

<span class='blue'>Thiên Vi Càn : là Khán Long Hữu Hối</span>

Con rồng bay quá cao chỉ còn một nước là rơi xuống. Làm chính trị không nên thành công quá mức.

Kiện dã là mạnh mẽ.
Ta bị sức mạnh. Ta được lớn mạnh.
Ta hùng mạnh cho kẻ khác. Ta cường bạo với kẻ khác.`
    },
    {
        title: "2. <span class='brown'>KHÔN</span> — Quẻ Số 2",
        content: `<b>Người Thọ Cảm : Thụ động, mềm mỏng, ngoại giao</b>

Thuận tòng, mềm dẻo, theo đường mà được lợi, hòa theo lẽ, chịu lấy. Quẻ Khôn tượng trưng cho đất và đại diện cho ý tưởng sản sinh, dịu hiền, phục tùng và vâng lời. Quẻ tượng trưng cho bóng tối và thuộc về người mẹ. Thuận dã là mềm mỏng.

<span class='green'>Quẻ Nhu Thuận Tần Mã</span>

Ngược với con rồng là con tần mã (ngựa cái) tượng trưng cho người chính trực đang ở vào cái thế cực khó, chỉ có thể hết sức giữ gìn nhượng bộ mới khỏi nguy.

Ta bị nhu nhược. Ta được sự nhu thuận.
Ta mềm mỏng với kẻ khác. Ta nhu nhược với kẻ khác.`
    },
    {
        title: "3. <span class='red'>THỦY LÔI TRUÂN</span> — Quẻ Số 3",
        content: `<b>Sự Khó Khăn Ban Đầu : Gian lao, khó khăn ban đầu, nguy hiểm</b>

Nạn dã. Gian lao. Yếu đuối, chưa đủ sức, ngần ngại, do dự, vất vả, phải nhờ sự giúp đỡ. Tiền hung hậu kiết chi tượng: trước dữ sau lành.

Trên là nước, dưới là sấm nổi dậy, vạn vật sinh nở (đầu mùa xuân sấm dậy). Truân tượng trưng cho sự bắt đầu của vạn sự. Giống như những mầm chồi non yếu ớt không thể chống chọi được với mưa rào và gió mạnh. Tình huống mới bắt đầu đầy gian khổ, khó khăn và trở ngại.

<span class='red'>Thủy Lôi Truân : là Tuyết sinh Mộc Mầm</span>

Trời sắp giông bão thì không khí uất kết. Ở vào thế này tuy đầy hy vọng nhưng cũng tràn ngập nguy nan. (Kinh Dịch gọi quẻ này là một trong bốn quẻ khó khăn nhất.)

Nạn dã là khó khăn, trở ngại.
Ta bị gian nan. Ta được cứu khổ.
Ta truân chuyên vì kẻ khác. Ta gây gian truân kẻ khác.`
    },
    {
        title: "4. <span class='red'>SƠN THỦY MÔNG</span> — Quẻ Số 4",
        content: `<b>Sự Điên Cuồng Của Tuổi Trẻ : Điên cuồng, tuổi trẻ, mù quáng, liều lĩnh</b>

Muội dã. Bất minh. Tối tăm, mờ ám, không minh bạch, che lấp, bao trùm, phủ chụp, ngu dại, ngờ nghệch. Thiên võng tứ trương chi tượng: lưới trời giăng bốn mặt.

Mông tượng trưng cho tuổi trẻ thiếu kinh nghiệm với những cách nhìn chưa thấu suốt. Thượng quái Cấn tượng trưng cho núi, hạ quái Khảm tượng trưng cho nước. Nước bốc hơi thành sương bao phủ núi — dấu hiệu của sự dốt nát, mơ hồ. Phải hết sức nỗ lực và biết lắng nghe sự chỉ dạy của người khôn ngoan.

<span class='red'>Sơn Thủy Mông : là Quẻ Cậu Bé Ngồi Trong Căn Nhà Tối</span>

Lúc khởi thủy không có gì to lớn ngay. Phải học tập, kiên nhẫn và bền chí là hai điều kiện cơ bản.

Muội dã là mờ mịt, tối tăm.
Ta bị ám muội. Ta được sự ám muội.
Ta che đậy mờ ám cho kẻ khác. Ta bất minh với kẻ khác.`
    },
    {
        title: "5. <span class='red'>THỦY THIÊN NHU</span> — Quẻ Số 5",
        content: `<b>Sự Chờ Đợi : Chờ đợi, nhẫn nại, sự kiên nhẫn, dẻo dai</b>

Thuận dã. Tương hội. Chờ đợi vì hiểm đằng trước, thuận theo, quây quần, tụ hội, vui hội, cứu xét, chầu về. Quân tử hoan hội chi tượng: quân tử vui vẻ hội họp, ăn uống chờ thời.

Nhu có nghĩa là chờ đợi. Hạ quái Càn tượng trưng cho sự khang kiện, tích cực. Thượng quái Khảm tiêu biểu cho sự nguy hiểm, gây cản trở. Càn là trời — bầu trời to lớn chứa cả vạn vật mà lại chịu nằm ở dưới Thủy, ấy chính là sự Nhu.

Quẻ hàm ý người ta cần tránh tinh thần cấp tiến cực đoan bằng cách chờ đợi nhẫn nại với lòng tự trọng và kỷ luật tự giác cho đến khi thời cơ tốt đẹp hơn.

Thuận dã là chờ đợi nhu cầu.
Ta bị nghiệm xét. Ta được cứu xét.
Ta nghiên cứu cho kẻ khác. Ta nghiệm xét kẻ khác.`
    },
    {
        title: "6. <span class='red'>THIÊN THỦY TỤNG</span> — Quẻ Số 6",
        content: `<b>Sự Tranh Chấp : Tranh chấp, nghi ngờ, bất đồng, kiện cáo</b>

Luận dã. Bất hòa. Bàn cãi, kiện tụng, bàn tính, cãi vã, tranh luận, bàn luận. Đại tiểu bất hòa chi tượng: lớn nhỏ không hòa.

Tụng có nghĩa là sự kiện tụng, tranh chấp. Đơn quái trên là Càn (cường tráng, vận động đi lên), đơn quái dưới là Khảm (nước chảy xuống) — hai đơn quái đôi nghịch lẫn nhau. Mọi việc thật phức tạp, đầy tranh chấp, trở ngại và xung đột.

<span class='red'>Thiên Thủy Tụng : là Quẻ Gặp Kẻ Ưa Tranh Kiện</span>

Luận dã là luận bàn, kiện cáo.
Ta bị tranh tụng. Ta được sự biện minh.
Ta biện luận cho kẻ khác. Ta gây gỗ kiện tụng kẻ khác.`
    },
    {
        title: "7. <span class='red'>ĐỊA THỦY SƯ</span> — Quẻ Số 7",
        content: `<b>Quân Đội : Quân đội, chỉ huy, bạo loạn, đau khổ</b>

Chúng dã. Chúng trợ. Đông chúng, vừa làm thầy vừa làm bạn, học hỏi lẫn nhau, nắm tay nhau qua truông, nâng đỡ. Sĩ chúng ủng tòng chi tượng: quần chúng ủng hộ nhau.

<span class='red'>Địa Thủy Sư : là Quẻ Nỗi Tân Khổ Của Kẻ Lãnh Đạo</span>

const body = document.getElementById('mainBody');
let searchTimer = null;

function buildHTML(data, query) {
    if (!data.length) {
        return '<p class="no-result">Không tìm thấy kết quả phù hợp.</p>';
    }
    return data.map((q, i) => {
        let title = q.title;
        let content = q.content;
        if (query) {
            const re = new RegExp(`(${query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
            content = content.replace(/<[^>]+>/g, m => `\x00${m}\x00`);
            const parts = content.split('\x00');
            content = parts.map((p, j) => {
                if (p.startsWith('<') && p.endsWith('>')) return p;
                return p.replace(re, '<mark>$1</mark>');
            }).join('');
        }
        return `<article class="que-block" style="animation-delay:${Math.min(i * 0.03, 0.5)}s">
            <div class="que-header"><h2>${title}</h2></div>
            <div class="que-body">${content}</div>
        </article>`;
    }).join('');
}

function showAll() {
    document.getElementById('findInput').value = '';
    document.getElementById('resultCount').style.display = 'none';
    body.innerHTML = buildHTML(fullData, '');
}

function doSearch() {
    const txt = document.getElementById('findInput').value.trim().toLowerCase();
    if (!txt) { showAll(); return; }
    const filtered = fullData.filter(q =>
        q.title.toLowerCase().includes(txt) || q.content.toLowerCase().includes(txt)
    );
    body.innerHTML = buildHTML(filtered, txt);
    const rc = document.getElementById('resultCount');
    rc.textContent = `${filtered.length} / 64 quẻ`;
    rc.style.display = 'inline-flex';
}

function debounceSearch() {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(doSearch, 320);
}

function scrollToTop() {
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

const backTop = document.getElementById('backTop');
window.addEventListener('scroll', () => {
    backTop.classList.toggle('show', window.scrollY > 400);
}, { passive: true });

showAll();
</script>
